<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cat P2P Chat v3.0</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header {
      background: #151c2c;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .chat-title { font-weight: bold; font-size: 1rem; color: #f8fafc; }
    .btn-icon { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #94a3b8; padding: 4px; }

    /* Settings Drawer */
    .drawer {
      background: #1e293b;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
    }
    .drawer select, .drawer input {
      background: #0f172a; border: 1px solid #475569; color: #00ff66; padding: 8px; border-radius: 6px; width: 100%; outline: none;
    }
    .drawer button { background: #22c55e; color: #000; font-weight: bold; padding: 8px; border-radius: 6px; border: none; cursor: pointer; }

    /* Chat Body */
    .chat-container {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }
    .bubble.me {
      align-self: flex-end;
      background: #15803d;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.them {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
      border: 1px solid #334155;
    }
    .bubble .time { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; text-align: right; display: block; }

    /* Special Gift Request Card in Chat */
    .gift-card {
      background: #2e1065;
      border: 1px solid #a855f7;
      border-radius: 12px;
      padding: 12px;
      width: 240px;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
    }
    .gift-title { font-weight: bold; color: #e9d5ff; font-size: 0.9rem; margin-bottom: 4px; }
    .gift-item { font-size: 1.1rem; color: #fff; font-weight: bold; margin: 6px 0; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; text-align: center; }
    .btn-ack-gift { background: #a855f7; color: #fff; border: none; padding: 6px; width: 100%; border-radius: 6px; font-weight: bold; margin-top: 6px; cursor: pointer; }

    /* Quick Toolbar */
    .quick-bar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: #0f172a;
      overflow-x: auto;
      border-top: 1px solid #1e293b;
    }
    .btn-quick {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-quick.alert { color: #f43f5e; border-color: #881337; }

    /* Input Footer */
    .chat-footer {
      display: flex;
      padding: 10px 12px;
      background: #151c2c;
      gap: 8px;
      align-items: center;
    }
    .chat-footer input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }
    .btn-send {
      background: #22c55e;
      color: #000;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal for Request Item */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box { background: #1e293b; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; border: 1px solid #a855f7; }
    .modal-box h3 { color: #e9d5ff; font-size: 1.1rem; margin-bottom: 12px; }
    .modal-box input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; margin-bottom: 12px; }
    .modal-box button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-info">
      <div id="dot" class="status-dot"></div>
      <div>
        <div class="chat-title">🐾 CAT P2P CHAT</div>
        <div id="status-text" style="font-size: 0.7rem; color: #94a3b8;">Offline</div>
      </div>
    </div>
    <button class="btn-icon" onclick="toggleDrawer()">⚙️</button>
  </header>

  <!-- Drawer ตั้งค่าล็อกอิน (ซ่อนไว้กดเปิดได้) -->
  <div id="drawer" class="drawer">
    <div>ตัวละครของคุณ:</div>
    <select id="role-select" onchange="initPeer()">
      <option value="Sechuan">🐱 ผมคือ: แมวเสฉวน</option>
      <option value="KaiToun">😸 ผมคือ: แมวไข่ตุ๋น</option>
    </select>
    <div>รหัสลับเข้าห้อง:</div>
    <input type="password" id="secret-key" value="cat-love-2026">
    <button onclick="initPeer(); toggleDrawer();">เชื่อมต่อ P2P</button>
  </div>

  <!-- Area แสดงข้อความแชต -->
  <div class="chat-container" id="chat-box">
    <div style="text-align: center; color: #64748b; font-size: 0.75rem; margin: 10px 0;">
      🔒 เข้ารหัสแบบ P2P ตรงระหว่างสองเครื่อง ไม่ผ่านเซิร์ฟเวอร์
    </div>
  </div>

  <!-- Quick Action Toolbar -->
  <div class="quick-bar">
    <button class="btn-quick alert" onclick="sendQuickAlert()">🍚 แจ้งหิวข้าว!</button>
    <button class="btn-quick" style="color: #a855f7; border-color: #a855f7;" onclick="openGiftModal()">🎁 ขอของแฟน</button>
    <button class="btn-quick" onclick="requestLocation()">📍 ขอพิกัด</button>
    <button class="btn-quick alert" onclick="requestAudioStream()">🎙️ ฟังเสียงไมค์</button>
  </div>

  <!-- Input Bar -->
  <div class="chat-footer">
    <input type="text" id="msg-input" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter') sendText();">
    <button class="btn-send" onclick="sendText()">➔</button>
  </div>

  <!-- Modal ขอของ -->
  <div id="gift-modal" class="modal">
    <div class="modal-box">
      <h3>🎁 ขอของจากแฟน</h3>
      <input type="text" id="gift-name" placeholder="เช่น ชานมไข่มุก, ขนม, สกินเกม">
      <button style="background: #a855f7; color: #fff;" onclick="sendGiftRequest()">ส่งคำขอของ</button>
      <button style="background: transparent; color: #94a3b8;" onclick="closeGiftModal()">ยกเลิก</button>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    let peer = null, conn = null, myRole = "", targetRole = "";

    function toggleDrawer() {
      const d = document.getElementById('drawer');
      d.style.display = (d.style.display === 'flex') ? 'none' : 'flex';
    }

    function getTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function initPeer() {
      const secret = document.getElementById('secret-key').value.trim();
      myRole = document.getElementById('role-select').value;
      targetRole = (myRole === "Sechuan") ? "KaiToun" : "Sechuan";

      if (!secret) return alert("กรุณาใส่รหัสผ่านลับ");

      if (peer) peer.destroy();

      peer = new Peer(`${secret}-${myRole}`, {
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', () => {
        document.getElementById('status-text').innerText = `Online (${myRole})`;
        document.getElementById('dot').className = "status-dot online";
        connectTarget(`${secret}-${targetRole}`);
      });

      peer.on('connection', (c) => { conn = c; setupListener(); });
      
      peer.on('call', (call) => {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(s => call.answer(s)).catch(() => call.answer());
      });
    }

    function connectTarget(targetId) {
      if (!peer) return;
      conn = peer.connect(targetId, { reliable: true });
      setupListener();
    }

    function setupListener() {
      if (!conn) return;
      conn.on('open', () => {
        document.getElementById('status-text').innerText = `คุยกับ [${targetRole}] อยู่`;
      });

      conn.on('data', (data) => {
        if (data.type === 'TEXT') appendBubble(data.text, 'them', data.time);
        else if (data.type === 'GIFT') appendGiftBubble(data.item, 'them', data.time);
        else if (data.type === 'GIFT_ACK') alert(`🎉 ${targetRole} กดสัญญาว่าจะซื้อ "${data.item}" ให้คุณแล้ว!`);
        else if (data.type === 'REQ_LOCATION') handleLocationRequest();
        else if (data.type === 'RESP_LOCATION') alert(`📍 พิกัดแฟน:\nhttps://maps.google.com/?q=${data.lat},${data.lng}`);
      });
    }

    function sendText() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !conn || !conn.open) return alert("ยังไม่ได้เชื่อมต่อกับอีกฝั่งครับ (กด ⚙️ เพื่อเช็กรหัส)");

      const time = getTime();
      conn.send({ type: 'TEXT', text, time });
      appendBubble(text, 'me', time);
      input.value = '';
    }

    function appendBubble(text, side, time) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `bubble ${side}`;
      div.innerHTML = `<div>${escapeHTML(text)}</div><span class="time">${time}</span>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // ฟังก์ชันขอของ
    function openGiftModal() { document.getElementById('gift-modal').style.display = 'flex'; }
    function closeGiftModal() { document.getElementById('gift-modal').style.display = 'none'; }

    function sendGiftRequest() {
      const item = document.getElementById('gift-name').value.trim();
      if (!item || !conn || !conn.open) return alert("กรุณาใส่ชื่อของที่อยากได้ หรือเช็กการเชื่อมต่อ");

      const time = getTime();
      conn.send({ type: 'GIFT', item, time });
      appendGiftBubble(item, 'me', time);
      closeGiftModal();
      document.getElementById('gift-name').value = '';
    }

    function appendGiftBubble(item, side, time) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.style.alignSelf = (side === 'me') ? 'flex-end' : 'flex-start';
      
      const isThem = (side === 'them');
      div.innerHTML = `
        <div class="gift-card">
          <div class="gift-title">🎁 ${side === 'me' ? 'คุณส่งคำขอของ' : 'แฟนส่งคำขอของ'}</div>
          <div class="gift-item">${escapeHTML(item)}</div>
          ${isThem ? `<button class="btn-ack-gift" onclick="ackGift('${escapeHTML(item)}')">❤️ ตกลง ซื้อให้!</button>` : '<div style="font-size:0.7rem; color:#a855f7; text-align:center;">รอแฟนกดตกลง...</div>'}
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function ackGift(item) {
      if (conn && conn.open) {
        conn.send({ type: 'GIFT_ACK', item });
        alert(`ส่งคำตอบรับเรียบร้อย! คุณสัญญาว่าจะซื้อ ${item} ให้แฟนแล้ว ❤️`);
      }
    }

    function sendQuickAlert() {
      const input = document.getElementById('msg-input');
      input.value = "🍚 แมวหิวข้าวแล้วนะ!";
      sendText();
    }

    function requestLocation() {
      if (!conn || !conn.open) return alert("ยังไม่เชื่อมต่อ");
      conn.send({ type: 'REQ_LOCATION' });
      alert("ส่งคำขอพิกัดเรียบร้อย");
    }

    function handleLocationRequest() {
      navigator.geolocation.getCurrentPosition(pos => {
        conn.send({ type: 'RESP_LOCATION', lat: pos.coords.latitude, lng: pos.coords.longitude });
      });
    }

    function requestAudioStream() {
      if (!peer) return alert("กรุณาต่อ P2P ก่อน");
      const secret = document.getElementById('secret-key').value.trim();
      navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
        const call = peer.call(`${secret}-${targetRole}`, s);
        call.on('stream', rs => {
          document.getElementById('remote-audio').srcObject = rs;
          alert("🎙️ ฟังเสียงไมค์ฝั่งตรงข้ามแล้ว");
        });
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]||tag));
    }
  </script>
</body>
</html>
