<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 ของเรา - Couple Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 800px;
            background: #1a1a2e;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #e0e0e0;
        }

        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f0c29, #302b63);
            min-height: 100%;
        }

        .login-screen.hidden {
            display: none;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
        }

        .login-subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
        }

        .login-form {
            width: 100%;
            max-width: 300px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 25px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            display: block;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            color: #fff;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .form-input:focus {
            outline: none;
            border-color: #FF6B6B;
            background: rgba(255,107,107,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FF6B6B, #FF8787);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .chat-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-screen.hidden {
            display: none;
        }

        .chat-header {
            background: linear-gradient(135deg, rgba(255,107,107,0.1), rgba(255,107,107,0.05));
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF6B6B, #FF8787);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-info h2 {
            font-size: 15px;
            color: #fff;
            margin: 0;
        }

        .header-info p {
            font-size: 11px;
            color: #aaa;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background: rgba(255,107,107,0.2);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #1a1a2e;
        }

        .message {
            display: flex;
            margin-bottom: 4px;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.3;
        }

        .message.received .message-bubble {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #FF6B6B, #FF8787);
            color: white;
        }

        .input-area {
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255,107,107,0.2);
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: rgba(255,107,107,0.3);
        }

        .input-field {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 14px;
            resize: none;
            max-height: 80px;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            color: #e0e0e0;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #FF6B6B;
            background: rgba(255,255,255,0.08);
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: linear-gradient(135deg, #FF6B6B, #FF8787);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .modal-header {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8787);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .input-text {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .input-text:focus {
            outline: none;
            border-color: #FF6B6B;
        }

        .profile-section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #FF6B6B;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <div class="logo">💕</div>
            <h1 class="login-title">ของเรา</h1>
            <p class="login-subtitle">พื้นที่ส่วนตัวสำหรับสองคนเท่านั้น</p>
            
            <div class="login-form">
                <label class="form-label">ใส่ PIN เข้าสู่ระบบ</label>
                <input 
                    type="password" 
                    id="pinInput" 
                    class="form-input" 
                    placeholder="••••" 
                    maxlength="6"
                >
                <button class="login-btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
            </div>
        </div>

        <!-- Chat Screen -->
        <div class="chat-screen hidden" id="chatScreen">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <div class="header-avatar">💕</div>
                    <div class="header-info">
                        <h2>ของเรา</h2>
                        <p>Online</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="openStats()" title="สถิติ">📊</button>
                    <button class="header-btn" onclick="openLetter()" title="จดหมาย">💌</button>
                    <button class="header-btn" onclick="openGifts()" title="ของขวัญ">🎁</button>
                    <button class="header-btn" onclick="openSettings()" title="ตั้งค่า">⚙️</button>
                </div>
            </div>

            <!-- Messages Area -->
            <div class="messages-area" id="messagesArea"></div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-actions">
                    <button class="action-btn" onclick="triggerImageInput()" title="รูปภาพ">🖼️</button>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect()">
                    <button class="action-btn" onclick="toggleVoice()" id="voiceBtn" title="เสียง">🎤</button>
                </div>
                <textarea 
                    class="input-field" 
                    id="messageInput" 
                    placeholder="พิมพ์ข้อความ..." 
                    rows="1"
                ></textarea>
                <button class="send-btn" onclick="sendMessage()" title="ส่ง">✈️</button>
            </div>
        </div>
    </div>

    <!-- Stats Modal -->
    <div class="modal" id="statsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeStats()">✕</button>
            <div class="modal-header">📊 สถิติความรัก</div>
            
            <div class="stat-item">
                <div class="stat-label">💬 ข้อความ</div>
                <div class="stat-value" id="msgCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">🖼️ รูปภาพ</div>
                <div class="stat-value" id="imgCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">🎤 เสียง</div>
                <div class="stat-value" id="audioCount">0</div>
            </div>
        </div>
    </div>

    <!-- Letter Modal -->
    <div class="modal" id="letterModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeLetter()">✕</button>
            <div class="modal-header">💌 จดหมายรักษ์</div>
            
            <textarea id="letterText" class="input-text" placeholder="เขียนจดหมายให้แฟน..." style="height: 200px; resize: vertical;"></textarea>
            <button class="btn" onclick="saveLetter()">💾 บันทึก</button>
            <div id="lettersContainer"></div>
        </div>
    </div>

    <!-- Gifts Modal -->
    <div class="modal" id="giftsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeGifts()">✕</button>
            <div class="modal-header">🎁 ของขวัญ</div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn" onclick="sendGift('💝', 'ของขวัญ')" style="font-size: 20px; padding: 20px;">💝</button>
                <button class="btn" onclick="sendGift('🎂', 'วันเกิด')" style="font-size: 20px; padding: 20px;">🎂</button>
                <button class="btn" onclick="sendGift('🎉', 'ฉลอง')" style="font-size: 20px; padding: 20px;">🎉</button>
                <button class="btn" onclick="sendGift('💐', 'ดอกไม้')" style="font-size: 20px; padding: 20px;">💐</button>
                <button class="btn" onclick="sendGift('🌹', 'กุหลาบ')" style="font-size: 20px; padding: 20px;">🌹</button>
                <button class="btn" onclick="sendGift('💍', 'แหวน')" style="font-size: 20px; padding: 20px;">💍</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeSettings()">✕</button>
            <div class="modal-header">⚙️ ตั้งค่า</div>
            
            <button class="btn" onclick="logout()">🚪 ออกจากระบบ</button>
            <button class="btn" onclick="clearData()" style="background: linear-gradient(135deg, #F44336, #EF5350);">🗑️ ลบข้อมูล</button>
        </div>
    </div>

    <script>
        const DB_KEY = 'coupleChat_';
        let messages = [];
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        function init() {
            const pin = localStorage.getItem(DB_KEY + 'pin');
            messages = JSON.parse(localStorage.getItem(DB_KEY + 'messages') || '[]');
            
            if (pin) {
                showChat();
                renderMessages();
            } else {
                showLogin();
            }
        }

        function handleLogin() {
            const pin = document.getElementById('pinInput').value;
            if (pin.length < 4) {
                alert('PIN ต้องมีอย่างน้อย 4 หลัก');
                return;
            }
            localStorage.setItem(DB_KEY + 'pin', pin);
            showChat();
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('chatScreen').classList.add('hidden');
        }

        function showChat() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;

            const msg = {
                id: Date.now(),
                text: text,
                sender: 'you',
                time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            };

            messages.push(msg);
            saveMessages();
            input.value = '';
            renderMessages();
        }

        function renderMessages() {
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender === 'you' ? 'sent' : 'received'}`;
                
                let content = '';
                if (msg.text) {
                    content = `<div class="message-bubble">${escapeHtml(msg.text)}</div>`;
                } else if (msg.image) {
                    content = `<div class="message-bubble"><img src="${msg.image}" style="max-width: 100%; border-radius: 8px;"></div>`;
                } else if (msg.audio) {
                    content = `<div class="message-bubble"><audio controls style="width: 100%; max-width: 200px;"><source src="${msg.audio}" type="audio/webm"></audio></div>`;
                }
                
                div.innerHTML = content;
                area.appendChild(div);
            });

            area.scrollTop = area.scrollHeight;
        }

        function saveMessages() {
            localStorage.setItem(DB_KEY + 'messages', JSON.stringify(messages));
        }

        function handleImageSelect() {
            const file = document.getElementById('imageInput').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    messages.push({
                        id: Date.now(),
                        image: e.target.result,
                        sender: 'you',
                        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                    });
                    saveMessages();
                    renderMessages();
                };
                reader.readAsDataURL(file);
            }
        }

        function triggerImageInput() {
            document.getElementById('imageInput').click();
        }

        function toggleVoice() {
            if (isRecording) {
                stopVoice();
            } else {
                startVoice();
            }
        }

        function startVoice() {
            isRecording = true;
            audioChunks = [];
            document.getElementById('voiceBtn').style.background = '#F44336';

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.start();
            }).catch(() => {
                alert('ไม่สามารถเข้าถึงไมค์');
                isRecording = false;
                document.getElementById('voiceBtn').style.background = '';
            });
        }

        function stopVoice() {
            if (!mediaRecorder) return;

            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);

                messages.push({
                    id: Date.now(),
                    audio: url,
                    sender: 'you',
                    time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                });
                saveMessages();
                renderMessages();
            };

            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            document.getElementById('voiceBtn').style.background = '';
        }

        function openStats() {
            const textCount = messages.filter(m => m.text).length;
            const imageCount = messages.filter(m => m.image).length;
            const audioCount = messages.filter(m => m.audio).length;

            document.getElementById('msgCount').textContent = textCount;
            document.getElementById('imgCount').textContent = imageCount;
            document.getElementById('audioCount').textContent = audioCount;
            document.getElementById('statsModal').classList.add('active');
        }

        function closeStats() {
            document.getElementById('statsModal').classList.remove('active');
        }

        function openLetter() {
            document.getElementById('letterModal').classList.add('active');
            renderLetters();
        }

        function closeLetter() {
            document.getElementById('letterModal').classList.remove('active');
        }

        function saveLetter() {
            const text = document.getElementById('letterText').value.trim();
            if (!text) {
                alert('กรุณาเขียนจดหมาย');
                return;
            }

            let letters = JSON.parse(localStorage.getItem(DB_KEY + 'letters') || '[]');
            letters.push({
                id: Date.now(),
                text: text,
                date: new Date().toLocaleDateString('th-TH')
            });
            localStorage.setItem(DB_KEY + 'letters', JSON.stringify(letters));
            document.getElementById('letterText').value = '';
            renderLetters();
            alert('✅ บันทึกจดหมาย');
        }

        function renderLetters() {
            const letters = JSON.parse(localStorage.getItem(DB_KEY + 'letters') || '[]');
            const container = document.getElementById('lettersContainer');
            container.innerHTML = '';

            if (letters.length === 0) {
                container.innerHTML = '<p style="color: #aaa; text-align: center;">ยังไม่มีจดหมาย</p>';
                return;
            }

            letters.reverse().forEach(letter => {
                const div = document.createElement('div');
                div.className = 'profile-section';
                div.innerHTML = `
                    <p style="color: #aaa; font-size: 11px; margin-bottom: 8px;">${letter.date}</p>
                    <p style="color: #e0e0e0; line-height: 1.5;">${escapeHtml(letter.text)}</p>
                `;
                container.appendChild(div);
            });
        }

        function openGifts() {
            document.getElementById('giftsModal').classList.add('active');
        }

        function closeGifts() {
            document.getElementById('giftsModal').classList.remove('active');
        }

        function sendGift(emoji, name) {
            messages.push({
                id: Date.now(),
                text: `🎁 ส่ง${name}ให้แฟน ${emoji}`,
                sender: 'you',
                time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            });
            saveMessages();
            renderMessages();
            closeGifts();
            showConfetti();
        }

        function showConfetti() {
            const confetti = document.createElement('div');
            confetti.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;';
            document.body.appendChild(confetti);

            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.style.cssText = `position: absolute; left: ${Math.random() * 100}%; top: -10px; font-size: 20px; animation: fall 3s linear forwards; opacity: 1;`;
                p.textContent = ['🎉', '💝', '✨', '💕', '🎊'][Math.floor(Math.random() * 5)];
                confetti.appendChild(p);
            }

            setTimeout(() => confetti.remove(), 3000);
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function logout() {
            if (confirm('ออกจากระบบ?')) {
                localStorage.removeItem(DB_KEY + 'pin');
                showLogin();
                document.getElementById('pinInput').value = '';
                closeSettings();
            }
        }

        function clearData() {
            if (confirm('ลบข้อมูลทั้งหมด?')) {
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith(DB_KEY)) {
                        localStorage.removeItem(key);
                    }
                });
                messages = [];
                renderMessages();
                alert('✅ ลบเรียบร้อย');
                closeSettings();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'messageInput') {
                e.preventDefault();
                sendMessage();
            }
        });

        const textarea = document.getElementById('messageInput');
        if (textarea) {
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
            });
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    top: 100%;
                    opacity: 0;
                    transform: rotate(360deg);
                }
            }
        `;
        document.head.appendChild(style);

        window.addEventListener('load', init);
    </script>
</body>
</html>
