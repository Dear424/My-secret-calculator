<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .calc-box { width: 320px; background: #000; padding: 20px; border-radius: 20px; }
        .display { font-size: 3rem; text-align: right; padding: 20px 10px; color: white; min-height: 60px; word-wrap: break-word; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { font-size: 1.5rem; border: none; border-radius: 50%; height: 65px; width: 65px; background: #333; color: white; cursor: pointer; }
        button.orange { background: #fe9e09; }
        button.gray { background: #a5a5a5; color: black; }
        .chat-box { display: none; width: 100%; max-width: 400px; height: 90vh; background: #1c1c1e; border-radius: 15px; flex-direction: column; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 70%; word-break: break-word; }
        .msg.me { background: #0b84fe; align-self: flex-end; }
        .msg.them { background: #3a3a3c; align-self: flex-start; }
        .chat-input { display: flex; padding: 10px; gap: 10px; background: #2c2c2e; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #1c1c1e; color: white; outline: none; }
        .send-btn { background: #0b84fe; color: white; border-radius: 20px; width: auto; padding: 0 15px; height: 40px; }
    </style>
</head>
<body>

    <!-- หน้าเครื่องคิดเลขพรางตา -->
    <div id="calcView" class="calc-box">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <button class="gray" onclick="press('C')">C</button>
            <button class="gray" onclick="press('+/-')">+/-</button>
            <button class="gray" onclick="press('%')">%</button>
            <button class="orange" onclick="press('/')">÷</button>
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="orange" onclick="press('*')">×</button>
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="orange" onclick="press('-')">-</button>
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button class="orange" onclick="press('+')">+</button>
            <button onclick="press('0')" style="grid-column: span 2; width: 140px; border-radius: 30px; text-align: left; padding-left: 25px;">0</button>
            <button onclick="press('.')">.</button>
            <button class="orange" onclick="checkSecret()">=</button>
        </div>
    </div>

    <!-- หน้าแชตลับ P2P -->
    <div id="chatView" class="chat-box">
        <div style="padding: 15px; background: #2c2c2e; border-top-left-radius: 15px; border-top-right-radius: 15px; text-align: center;">
            <small id="status">กำลังเชื่อมต่อ...</small>
        </div>
        <div id="messages" class="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">ส่ง</button>
        </div>
    </div>

    <script>
        let inputStr = "";
        let peer, conn;
        // รหัสลับเข้าแชต เปลี่ยนตรงนี้ได้เลย (เช่น 1234)
        const SECRET_CODE = "1234"; 

        function press(val) {
            if(val === 'C') inputStr = "";
            else inputStr += val;
            document.getElementById('display').innerText = inputStr || "0";
        }

        function checkSecret() {
            if(inputStr === SECRET_CODE) {
                document.getElementById('calcView').style.display = 'none';
                document.getElementById('chatView').style.display = 'flex';
                initP2P();
            } else {
                try {
                    inputStr = eval(inputStr).toString();
                    document.getElementById('display').innerText = inputStr;
                } catch {
                    document.getElementById('display').innerText = "Error";
                    inputStr = "";
                }
            }
        }

        function initP2P() {
            // ระบบสร้างห้องเชื่อมต่อ P2P ข้ามระยะไกล
            peer = new Peer('secret-room-love-1234'); // ตั้งชื่อห้องให้ตรงกันทั้งสองฝั่ง

            peer.on('open', (id) => {
                document.getElementById('status').innerText = "รอการเชื่อมต่อจากแฟน...";
            });

            peer.on('connection', (c) => {
                conn = c;
                setupChat();
            });

            peer.on('error', (err) => {
                // ถ้าห้องมีอยู่แล้ว ให้ลองเชื่อมต่อเข้าไปในฐานะผู้จอย
                conn = peer.connect('secret-room-love-1234');
                setupChat();
            });
        }

        function setupChat() {
            conn.on('open', () => {
                document.getElementById('status').innerText = "เชื่อมต่อปลอดภัยแล้ว (P2P)";
            });

            conn.on('data', (data) => {
                addMessage(data, 'them');
            });
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(input.value && conn) {
                conn.send(input.value);
                addMessage(input.value, 'me');
                input.value = '';
            }
        }

        function addMessage(text, side) {
            const div = document.createElement('div');
            div.className = `msg ${side}`;
            div.innerText = text;
            const msgs = document.getElementById('messages');
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }
    </script>
</body>
</html>
