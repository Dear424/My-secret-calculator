<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Popup with Sound System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sukhumvit Set', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Demo Controller UI */
        .controls-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 320px;
        }

        .controls-card h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; }
        .btn-danger  { background: #ef4444; }
        .btn-info    { background: #3b82f6; }

        /* Notification Toast Container */
        #notification-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: calc(100% - 48px);
            pointer-events: none;
        }

        /* Individual Toast Style */
        .toast {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid #3b82f6;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        .toast.toast-hide {
            animation: slideOut 0.3s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        /* Type Variations */
        .toast.success { border-left-color: #10b981; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.danger  { border-left-color: #ef4444; }
        .toast.info    { border-left-color: #3b82f6; }

        .toast-icon {
            font-size: 1.25rem;
            line-height: 1;
            margin-top: 2px;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #f1f5f9;
            margin-bottom: 2px;
        }

        .toast-message {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .toast-close {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 4px;
            transition: color 0.2s;
        }

        .toast-close:hover {
            color: #f8fafc;
        }

        /* Auto Dismiss Progress Bar */
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform-origin: left;
            animation: progress linear forwards;
        }

        .toast.success .toast-progress { background: #10b981; }
        .toast.warning .toast-progress { background: #f59e0b; }
        .toast.danger  .toast-progress { background: #ef4444; }
        .toast.info    .toast-progress { background: #3b82f6; }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(100%) scale(0.9);
            }
        }

        @keyframes progress {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }
    </style>
</head>
<body>

    <!-- Controls UI -->
    <div class="controls-card">
        <h2>ทดสอบระบบการแจ้งเตือน</h2>
        <button class="btn btn-success" onclick="notify('success', 'ทำรายการสำเร็จ', 'บันทึกข้อมูลเรียบร้อยแล้ว')">Success Notification</button>
        <button class="btn btn-warning" onclick="notify('warning', 'คำเตือนระบบ', 'พื้นที่จัดเก็บของคุณใกล้จะเต็ม')">Warning Notification</button>
        <button class="btn btn-danger"  onclick="notify('danger',  'เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้')">Danger Notification</button>
        <button class="btn btn-info"    onclick="notify('info',    'ข้อความใหม่', 'คุณได้รับข้อความจากทีมสนับสนุน')">Info Notification</button>
    </div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <script>
        // Web Audio API Sound Generator (ทำงานได้เลยโดยไม่ต้องพึ่งไฟล์ .mp3 ภายนอก)
        function playNotificationSound(type = 'info') {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();

                // ปรับแต่งความถี่และโทนเสียงตามประเภท
                const sounds = {
                    success: [ { freq: 523.25, time: 0 }, { freq: 659.25, time: 0.1 }, { freq: 783.99, time: 0.2 } ], // C5, E5, G5 (คอร์ดสดใส)
                    warning: [ { freq: 440, time: 0 }, { freq: 440, time: 0.15 } ],                                  // A4, A4 (เตือนเบาๆ)
                    danger:  [ { freq: 311.13, time: 0 }, { freq: 293.66, time: 0.15 } ],                              // Eb4, D4 (เสียงทุ้มเตือนภัย)
                    info:    [ { freq: 587.33, time: 0 }, { freq: 880, time: 0.12 } ]                                  // D5, A5 (ชานม)
                };

                const sequence = sounds[type] || sounds.info;

                sequence.forEach(note => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = type === 'danger' ? 'sawtooth' : 'sine';
                    osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime + note.time);

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + note.time);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + note.time + 0.25);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime + note.time);
                    osc.stop(audioCtx.currentTime + note.time + 0.25);
                });
            } catch (e) {
                console.warn("Audio Context error or user has not interacted with document yet.", e);
            }
        }

        // Icons Map
        const icons = {
            success: '✓',
            warning: '⚠️',
            danger:  '✕',
            info:    'ℹ️'
        };

        // Main Notification Function
        function notify(type = 'info', title = '', message = '', duration = 4000) {
            const container = document.getElementById('notification-container');

            // เล่นเสียงแจ้งเตือน
            playNotificationSound(type);

            // สร้าง Element
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            toast.innerHTML = `
                <div class="toast-icon">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="closeToast(this.parentElement)">&times;</button>
                <div class="toast-progress" style="animation-duration: ${duration}ms;"></div>
            `;

            container.appendChild(toast);

            // Auto Dismiss
            const timer = setTimeout(() => {
                closeToast(toast);
            }, duration);

            // เก็บ Timer ไว้ถ้าต้องการยกเลิก
            toast.dataset.timer = timer;
        }

        // Close Toast Function
        function closeToast(toast) {
            if (toast.classList.contains('toast-hide')) return;
            
            clearTimeout(toast.dataset.timer);
            toast.classList.add('toast-hide');
            
            toast.addEventListener('animationend', () => {
                toast.remove();
            });
        }
    </script>
</body>
</html>
